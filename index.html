<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Barcode Battle v0.2</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#07111f;--p:#0f1b2d;--l:#28405f;--t:#eef6ff;--m:#95aac3;--a:#5eead4;--g:#fbbf24;--r:#fb7185}*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:16px 16px 80px}.brand{font-size:25px;font-weight:900}.muted{color:var(--m);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:sticky;top:0;background:#07111feF;padding:10px 0;z-index:5}.tab,.btn{border:0;border-radius:12px;padding:12px;font-weight:800}.tab{background:#13243b;color:#b6c6d9}.tab.active,.btn{background:var(--a);color:#052521}.btn.secondary{background:#203754;color:white}.btn.danger{background:var(--r);color:white}.screen{display:none}.screen.active{display:block}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:210px;padding:13px;border-radius:12px;border:1px solid #36506f;background:#081421;color:white;font-size:16px}.hero{display:grid;grid-template-columns:150px 1fr;gap:15px;align-items:center}.portrait{aspect-ratio:1;border-radius:18px;background:#081321;overflow:hidden;border:1px solid var(--l)}.portrait svg{width:100%;height:100%}.name{font-size:24px;font-weight:900}.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.badge{font-size:12px;border:1px solid #385577;background:#15283f;border-radius:999px;padding:5px 8px}.stars{color:var(--g)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:#091624;border:1px solid #203b59;border-radius:12px;padding:9px}.stat b{display:block;font-size:21px}.skill{margin-top:10px;background:#091624;border-radius:12px;padding:10px}.progress{height:9px;background:#24364d;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--a)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#0b1727;border:1px solid var(--l);border-radius:14px;padding:9px;color:white;text-align:left}.mini.selected{outline:2px solid var(--a)}.miniimg{aspect-ratio:1;border-radius:10px;overflow:hidden}.miniimg svg{width:100%;height:100%}.tiny{font-size:11px;color:var(--m)}.battle{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fighter{background:#091522;border:1px solid var(--l);border-radius:15px;padding:10px}.fighter .portrait{max-width:150px;margin:auto}.hpbar{height:12px;background:#422735;border-radius:999px;overflow:hidden}.hpbar>div{height:100%;background:#4ade80;transition:.25s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.log{background:#030b14;border-radius:12px;padding:10px;min-height:150px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:13px;margin-top:10px}.result{text-align:center;font-size:21px;font-weight:900;padding:8px}.empty{text-align:center;color:var(--m);padding:20px}@media(max-width:620px){.hero{grid-template-columns:105px 1fr}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.brand{font-size:21px}}
</style></head><body><div class="app"><div class="brand">⚡ BARCODE BATTLE <span class="muted">v0.2</span></div><div class="muted">召喚・保存・図鑑・育成・COMバトル</div>
<nav class="tabs"><button class="tab active" data-tab="scan">召喚</button><button class="tab" data-tab="box">BOX</button><button class="tab" data-tab="dex">図鑑</button><button class="tab" data-tab="battle">バトル</button></nav>
<section id="scan" class="screen active"><div class="card"><div class="row"><input id="code" inputmode="numeric" placeholder="バーコード数字（4桁以上）"><button id="summon" class="btn">召喚</button></div><div class="muted" style="margin-top:8px">同じバーコードでも個体差が出ます。</div></div><div id="result" class="card" hidden><div class="hero"><div id="portrait" class="portrait"></div><div><div id="name" class="name"></div><div class="badges"><span id="stars" class="badge stars"></span><span id="element" class="badge"></span><span id="type" class="badge"></span><span id="rank" class="badge"></span></div><div>Lv.<b id="level"></b></div><div class="muted">EXP <span id="xptext"></span></div><div class="progress"><div id="xpbar"></div></div></div></div><div class="stats"><div class="stat">HP<b id="hp"></b></div><div class="stat">攻撃<b id="atk"></b></div><div class="stat">防御<b id="def"></b></div><div class="stat">素早さ<b id="spd"></b></div></div><div id="skill" class="skill"></div><div class="row" style="margin-top:10px"><button id="save" class="btn">BOXに保存</button><button id="reroll" class="btn secondary">同じコードでもう1体</button></div></div></section>
<section id="box" class="screen"><div class="card"><div><b>モンスターBOX</b> <span id="boxcount" class="muted"></span></div><div id="boxgrid" class="grid" style="margin-top:10px"></div></div><div id="detail" class="card" hidden><div class="hero"><div id="dportrait" class="portrait"></div><div><div id="dname" class="name"></div><div id="dmeta" class="badges"></div><div id="dlevel"></div><div id="dxp" class="muted"></div><div class="progress"><div id="dxpbar"></div></div></div></div><div id="dstats" class="stats"></div><div id="dskill" class="skill"></div><div class="row" style="margin-top:10px"><button id="choose" class="btn">このキャラで戦う</button><button id="remove" class="btn danger">削除</button></div></div></section>
<section id="dex" class="screen"><div class="card"><b>キャラ図鑑</b> <span id="dexcount" class="muted"></span><div id="dexgrid" class="grid" style="margin-top:10px"></div></div></section>
<section id="battle" class="screen"><div class="card"><div id="battleempty" class="empty">BOXから戦うキャラを選んでください。</div><div id="battlearea" hidden><div class="battle"><div class="fighter"><div id="pp" class="portrait"></div><b id="pn"></b><div id="pl" class="tiny"></div><div class="tiny">HP <span id="pht"></span></div><div class="hpbar"><div id="ph"></div></div></div><div class="fighter"><div id="ep" class="portrait"></div><b id="en"></b><div id="el" class="tiny"></div><div class="tiny">HP <span id="eht"></span></div><div class="hpbar"><div id="eh"></div></div></div></div><div class="actions"><button id="attack" class="btn">⚔ 通常攻撃</button><button id="special" class="btn secondary">✨ 特殊攻撃</button><button id="guard" class="btn secondary">🛡 防御</button></div><div class="row" style="margin-top:8px"><button id="newenemy" class="btn secondary">新しいCOM</button></div><div id="bres" class="result"></div><div id="blog" class="log"></div></div></div></section>
<div class="row"><button id="reset" class="btn danger">保存データ初期化</button></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='barcodeBattle02';let S=JSON.parse(localStorage.getItem(KEY)||'{"monsters":[],"dex":{},"battleId":null}'),cur=null,sel=null,B=null;const els=['炎','水','雷','風','土','光','闇'],tys=['ドラゴン','ビースト','ゴーレム','スライム','マシン','スピリット','ナイト','バード'],A=['フレイム','アクア','ボルト','ストーム','ロック','ルミナ','ナイト','ギア','ファング','ゼロ'],C=['ホーン','ウルフ','レックス','ゴーレム','スライム','クロウ','ナイト','ドレイク','バイト','コア'],SK=[['連撃','22%で追加攻撃','double'],['鉄壁','被ダメージ18%軽減','guard'],['先制','最初の攻撃40%強化','first'],['吸収','与ダメージの18%回復','drain'],['会心','20%でダメージ1.8倍','crit'],['逆境','HP30%以下で攻撃35%強化','pinch'],['再生','行動後に5%回復','regen'],['俊足','素早いほど追加ダメージ','speed']];function save(){localStorage.setItem(KEY,JSON.stringify(S))}function h(s){let x=2166136261>>>0;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}function rnd(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function need(l){return 80+l*45}function uid(){return'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function species(code){let seed=h(code),r=rnd(seed);return{seed,element:els[Math.floor(r()*els.length)],type:tys[Math.floor(r()*tys.length)],name:A[Math.floor(r()*A.length)]+C[Math.floor(r()*C.length)],sid:String(seed%9999).padStart(4,'0')}}function make(code){code=String(code).replace(/\D/g,'');if(code.length<4)throw Error('4桁以上の数字を入力してください');let sp=species(code),r=rnd((sp.seed^Date.now()^Math.floor(Math.random()*0xffffffff))>>>0),rr=(sp.seed%1000)/1000,stars=rr>.985?5:rr>.92?4:rr>.74?3:rr>.42?2:1;if(r()>.94&&stars<5)stars++;let base={hp:Math.round(80+(sp.seed%45)+r()*25+stars*10),atk:Math.round(40+((sp.seed>>>5)%42)+r()*22+stars*7),def:Math.round(36+((sp.seed>>>9)%40)+r()*20+stars*7),spd:Math.round(35+((sp.seed>>>13)%48)+r()*22+stars*7)},iv=(base.hp+base.atk+base.def+base.spd)/4,rank=iv>120?'S':iv>105?'A':iv>90?'B':'C',sk=SK[Math.floor(r()*SK.length)];return{id:uid(),barcode:code,...sp,stars,rank,base,level:1,xp:0,skill:{name:sk[0],desc:sk[1],kind:sk[2]}}}function st(m,k){return Math.round(m.base[k]*(1+(m.level-1)*.055))}function stats(m){return{hp:st(m,'hp'),atk:st(m,'atk'),def:st(m,'def'),spd:st(m,'spd')}}function stars(m){return'★'.repeat(m.stars)+'☆'.repeat(5-m.stars)}const PAL={'炎':['#ff7a45','#7f1d1d'],'水':['#38bdf8','#164e63'],'雷':['#facc15','#713f12'],'風':['#5eead4','#134e4a'],'土':['#a3a3a3','#44403c'],'光':['#fde68a','#78716c'],'闇':['#a78bfa','#312e81']};function pic(m){let[c1,c2]=PAL[m.element],r=rnd(m.seed),horn=r()>.45?`<path d="M28 35L19 10L42 29Z" fill="${c2}"/><path d="M72 35L81 10L58 29Z" fill="${c2}"/>`:'';return`<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#07111f"/><circle cx="50" cy="50" r="42" fill="${c2}" opacity=".5"/>${horn}<circle cx="50" cy="54" r="31" fill="${c1}"/><circle cx="38" cy="47" r="4" fill="white"/><circle cx="62" cy="47" r="4" fill="white"/><circle cx="39" cy="47" r="2"/><circle cx="61" cy="47" r="2"/><path d="M36 67Q50 76 64 67" fill="none" stroke="#102033" stroke-width="4" stroke-linecap="round"/></svg>`}function addDex(m){if(!S.dex[m.sid])S.dex[m.sid]={sid:m.sid,name:m.name,element:m.element,type:m.type,seed:m.seed,seen:0};S.dex[m.sid].seen++;save()}function render(m){cur=m;$('#result').hidden=false;$('#portrait').innerHTML=pic(m);$('#name').textContent=m.name;$('#stars').textContent=stars(m);$('#element').textContent=m.element;$('#type').textContent=m.type;$('#rank').textContent='個体 '+m.rank;$('#level').textContent=m.level;$('#xptext').textContent=`${m.xp}/${need(m.level)}`;$('#xpbar').style.width=(m.xp/need(m.level)*100)+'%';let s=stats(m);['hp','atk','def','spd'].forEach(k=>$('#'+k).textContent=s[k]);$('#skill').innerHTML=`<b>${m.skill.name}</b><div class="muted">${m.skill.desc}</div>`}function summon(){try{let m=make($('#code').value);addDex(m);render(m);renderDex();$('#save').disabled=false;$('#save').textContent='BOXに保存'}catch(e){alert(e.message)}}function renderBox(){$('#boxcount').textContent=`${S.monsters.length}/60体`;let g=$('#boxgrid');g.innerHTML='';if(!S.monsters.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">まだいません</div>';$('#detail').hidden=true;return}S.monsters.forEach(m=>{let b=document.createElement('button');b.className='mini'+(m.id===sel?' selected':'');b.innerHTML=`<div class="miniimg">${pic(m)}</div><b>${m.name}</b><div class="tiny">Lv.${m.level} / ${m.element} / ${stars(m)}</div>`;b.onclick=()=>{sel=m.id;renderBox();detail(m)};g.appendChild(b)})}function detail(m){$('#detail').hidden=false;$('#dportrait').innerHTML=pic(m);$('#dname').textContent=m.name;$('#dmeta').innerHTML=`<span class="badge stars">${stars(m)}</span><span class="badge">${m.element}</span><span class="badge">${m.type}</span><span class="badge">個体 ${m.rank}</span>`;$('#dlevel').textContent='Lv.'+m.level;$('#dxp').textContent=`EXP ${m.xp}/${need(m.level)}`;$('#dxpbar').style.width=(m.xp/need(m.level)*100)+'%';let s=stats(m);$('#dstats').innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat">${{hp:'HP',atk:'攻撃',def:'防御',spd:'素早さ'}[k]}<b>${v}</b></div>`).join('');$('#dskill').innerHTML=`<b>${m.skill.name}</b><div class="muted">${m.skill.desc}</div>`}function renderDex(){let a=Object.values(S.dex);$('#dexcount').textContent=`発見 ${a.length}種`;let g=$('#dexgrid');g.innerHTML='';a.forEach(d=>{let m={...d,element:d.element,type:d.type,name:d.name,seed:d.seed};let x=document.createElement('div');x.className='mini';x.innerHTML=`<div class="miniimg">${pic(m)}</div><b>No.${d.sid} ${d.name}</b><div class="tiny">${d.element}/${d.type} 遭遇${d.seen}回</div>`;g.appendChild(x)});if(!a.length)g.innerHTML='<div class="empty" style="grid-column:1/-1">召喚すると埋まります</div>'}function tab(id){$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='box')renderBox();if(id==='dex')renderDex();if(id==='battle')startBattle()}function level(m,g){m.xp+=g;let up=0;while(m.xp>=need(m.level)&&m.level<50){m.xp-=need(m.level);m.level++;up++}return up}function enemyFor(m){let e=make(String(Math.floor(1e12+Math.random()*8.9e12)));e.level=Math.max(1,Math.min(50,m.level+Math.floor(Math.random()*5)-2));return e}function unit(m){let s=stats(m);return{...m,...s,maxHp:s.hp,currentHp:s.hp,first:true,guarding:false}}function startBattle(){let m=S.monsters.find(x=>x.id===S.battleId);if(!m){$('#battleempty').hidden=false;$('#battlearea').hidden=true;return}B={p:unit(m),e:unit(enemyFor(m)),src:m.id,over:false};$('#battleempty').hidden=true;$('#battlearea').hidden=false;$('#bres').textContent='';$('#blog').textContent='';log(`⚔ バトル開始！\n${B.p.name} vs ${B.e.name}`);ui()}function dmg(a,d,special){let p=a.atk*(.9+Math.random()*.2),note='';if(a.skill.kind==='pinch'&&a.currentHp/a.maxHp<=.3){p*=1.35;note+='逆境! '}if(a.skill.kind==='first'&&a.first){p*=1.4;note+='先制! '}if(a.skill.kind==='speed')p*=1+Math.min(.3,a.spd/700);let z=Math.max(1,Math.round(p-d.def*.38));if(special)z=Math.round(z*1.3);if(a.skill.kind==='crit'&&Math.random()<.2){z=Math.round(z*1.8);note+='会心! '}if(d.guarding){z=Math.round(z*.52);note+='防御! '}if(d.skill.kind==='guard')z=Math.round(z*.82);d.currentHp=Math.max(0,d.currentHp-z);if(a.skill.kind==='drain'){let q=Math.max(1,Math.round(z*.18));a.currentHp=Math.min(a.maxHp,a.currentHp+q);note+=`吸収+${q} `}a.first=false;d.guarding=false;if(a.skill.kind==='double'&&Math.random()<.22&&d.currentHp>0){let q=Math.max(1,Math.round(z*.55));d.currentHp=Math.max(0,d.currentHp-q);note+=`連撃+${q} `}return[z,note]}function regen(u){if(u.skill.kind==='regen'&&u.currentHp>0){let q=Math.max(1,Math.round(u.maxHp*.05));u.currentHp=Math.min(u.maxHp,u.currentHp+q);return q}return 0}function act(k){if(!B||B.over)return;if(k==='guard'){B.p.guarding=true;log(`${B.p.name}は防御！`)}else{let[z,n]=dmg(B.p,B.e,k==='special');log(`${B.p.name}の${k==='special'?'特殊攻撃':'攻撃'}！ ${z}ダメージ ${n}`)}let q=regen(B.p);if(q)log(`${B.p.name}は${q}回復`);ui();if(end())return;setTimeout(cpu,350)}function cpu(){if(!B||B.over)return;if(Math.random()<.18){B.e.guarding=true;log(`${B.e.name}は防御！`)}else{let sp=Math.random()<.38,[z,n]=dmg(B.e,B.p,sp);log(`COM ${B.e.name}の${sp?'特殊攻撃':'攻撃'}！ ${z}ダメージ ${n}`)}let q=regen(B.e);if(q)log(`${B.e.name}は${q}回復`);ui();end()}function end(){if(B.e.currentHp<=0){finish(true);return true}if(B.p.currentHp<=0){finish(false);return true}return false}function finish(win){B.over=true;if(win){let m=S.monsters.find(x=>x.id===B.src),gain=35+B.e.level*10+B.e.stars*5,up=level(m,gain);$('#bres').textContent=`🏆 WIN! +${gain}EXP${up?' / LEVEL UP! Lv.'+m.level:''}`}else $('#bres').textContent='💀 LOSE';save();ui()}function ui(){let p=B.p,e=B.e;$('#pp').innerHTML=pic(p);$('#ep').innerHTML=pic(e);$('#pn').textContent=p.name;$('#en').textContent=e.name;$('#pl').textContent='Lv.'+p.level;$('#el').textContent='Lv.'+e.level;$('#pht').textContent=`${p.currentHp}/${p.maxHp}`;$('#eht').textContent=`${e.currentHp}/${e.maxHp}`;$('#ph').style.width=(p.currentHp/p.maxHp*100)+'%';$('#eh').style.width=(e.currentHp/e.maxHp*100)+'%'}function log(t){$('#blog').textContent+=t+'\n';$('#blog').scrollTop=$('#blog').scrollHeight}$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('#summon').onclick=summon;$('#reroll').onclick=summon;$('#save').onclick=()=>{if(cur&&S.monsters.length<60){S.monsters.push(cur);S.battleId=cur.id;save();renderBox();$('#save').disabled=true;$('#save').textContent='保存済み';alert('BOXに保存しました')}};$('#choose').onclick=()=>{S.battleId=sel;save();tab('battle')};$('#remove').onclick=()=>{if(sel&&confirm('削除しますか？')){S.monsters=S.monsters.filter(x=>x.id!==sel);if(S.battleId===sel)S.battleId=S.monsters[0]?.id||null;sel=null;save();renderBox()}};$('#attack').onclick=()=>act('attack');$('#special').onclick=()=>act('special');$('#guard').onclick=()=>act('guard');$('#newenemy').onclick=startBattle;$('#reset').onclick=()=>{if(confirm('すべての保存データを初期化しますか？')){localStorage.removeItem(KEY);location.reload()}};$('#code').onkeydown=e=>{if(e.key==='Enter')summon()};renderBox();renderDex();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
